<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Nytt lösenord – Laholm Combat Sports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-body">

  <div class="auth-container">
    <div class="auth-logo">
      <img src="assets/logo.jpg" alt="Laholm Combat Sports">
    </div>

    <h1 class="auth-title">Nytt lösenord</h1>
    <p class="integration-note" id="resetIntro">Kontrollerar din återställningslänk ...</p>

    <form id="resetForm" class="auth-form" hidden>
      <label for="newPassword">Nytt lösenord</label>
      <input type="password" id="newPassword" placeholder="Minst 8 tecken" autocomplete="new-password" minlength="8" required>

      <label for="confirmPassword">Upprepa lösenordet</label>
      <input type="password" id="confirmPassword" placeholder="Upprepa lösenordet" autocomplete="new-password" minlength="8" required>

      <button type="submit" class="btn-primary" id="savePasswordBtn">Spara nytt lösenord</button>
    </form>

    <p id="resetStatus" class="status-message" role="status" aria-live="polite"></p>

    <p class="auth-links">
      <a href="login.html">Tillbaka till inloggningen</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-init.js"></script>

  <script src="reset-password.js"></script>
</body>
</html>
