<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp' 'sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://dvtntpfisueeyapdoizv.supabase.co wss://dvtntpfisueeyapdoizv.supabase.co; frame-src https://www.google.com; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Nytt lösenord – Laholm Combat Sports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-body">

  <div class="auth-container">
    <div class="auth-logo">
      <img src="assets/logo.jpg" alt="Laholm Combat Sports">
    </div>

    <h1 class="auth-title">Nytt lösenord</h1>
    <p class="integration-note" id="resetIntro">Kontrollerar din återställningslänk ...</p>

    <form id="resetForm" class="auth-form" hidden>
      <label for="newPassword">Nytt lösenord</label>
      <input type="password" id="newPassword" placeholder="Minst 10 tecken" autocomplete="new-password" minlength="10" maxlength="128" aria-describedby="resetPasswordHelp" autocapitalize="none" spellcheck="false" required>
      <small id="resetPasswordHelp" class="field-help">Minst 10 tecken. Använd ett unikt lösenord som du inte använder på andra webbplatser.</small>

      <label for="confirmPassword">Upprepa lösenordet</label>
      <input type="password" id="confirmPassword" placeholder="Upprepa lösenordet" autocomplete="new-password" minlength="10" maxlength="128" autocapitalize="none" spellcheck="false" required>

      <button type="submit" class="btn-primary" id="savePasswordBtn">Spara nytt lösenord</button>
    </form>

    <p id="resetStatus" class="status-message" role="status" aria-live="polite"></p>

    <p class="auth-links">
      <a href="login.html">Tillbaka till inloggningen</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="supabase-init.js"></script>

  <script src="reset-password.js"></script>
</body>
</html>
