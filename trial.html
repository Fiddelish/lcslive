<body class="auth-body">

  <div class="auth-container">
    <div class="auth-logo">
      <img src="assets/logo.jpg" alt="Laholm Combat Sports">
    </div>

    <h1 class="auth-title">Prova på</h1>
    <p class="auth-sub">Fyll i dina uppgifter så kontaktar vi dig.</p>
    <p class="integration-note">Formuläret kan inte skickas förrän Supabase är anslutet.</p>

    <form id="trialForm" class="auth-form">

      <label for="name">Namn</label>
      <input type="text" id="name" placeholder="För- och efternamn" autocomplete="name" required>

      <label for="phone">Telefonnummer</label>
      <input type="tel" id="phone" placeholder="070‑123 45 67" autocomplete="tel" required>

      <label for="email">E‑post</label>
      <input type="email" id="email" placeholder="dinmail@example.com" autocomplete="email" required>

      <button type="submit" class="btn-primary">Skicka</button>
    </form>

    <p id="trialStatus" class="status-message" role="status" aria-live="polite"></p>

    <p class="integration-note">Genom att skicka formuläret har du tagit del av <a href="integritetspolicy.html" target="_blank" rel="noopener">integritetspolicyn</a>.</p>
